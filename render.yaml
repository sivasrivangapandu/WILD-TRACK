services:
  # -------------------------------------------------------------
  # Backend: FastAPI / Uvicorn Service
  # -------------------------------------------------------------
  - type: web
    name: wildtrack-backend
    env: python
    region: oregon 
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: https://wildtrack-frontend-iuww.onrender.com,https://wildtrack-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set via dashboard
      - key: NINJA_API_KEY
        sync: false # Set via dashboard
      - key: CLOUDINARY_URL
        sync: false # Set via dashboard

  # -------------------------------------------------------------
  # Frontend: React / Vite Static Site
  # -------------------------------------------------------------
  - type: web
    name: wildtrack-frontend
    env: static
    region: oregon
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://wildtrack-backend-j9n8.onrender.com
    routes:
      # React SPA routing rule
      - type: rewrite
        source: /*
        destination: /index.html
